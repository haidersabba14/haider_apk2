name: HaiderAPK
options:
  bundleIdPrefix: com.haider
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

targets:
  HaiderAPK:
    type: application
    platform: iOS
    sources:
      - path: HaiderAPK/Sources
      - path: HaiderAPK/Assets.xcassets
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haider.apkemulator
        PRODUCT_NAME: HaiderAPK
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Haider APK"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  HaiderAPK:
    build:
      targets:
        HaiderAPK: all
    run:
      config: Debug
    archive:
      config: Release
